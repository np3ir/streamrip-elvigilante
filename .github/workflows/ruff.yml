name: Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lint only. This fork keeps its own compact formatting (one-liners etc.),
      # so `ruff format --check` is intentionally not enforced.
      - uses: chartboost/ruff-action@v1
